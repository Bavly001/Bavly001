<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Bavly Ashraf – Software Engineer">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#06B6D4" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1060" cy="50" r="180" fill="url(#cyanGlow)" />
  <circle cx="140" cy="200" r="160" fill="url(#indigoGlow)" />
  <circle cx="980" cy="200" r="130" fill="url(#indigoGlow)" />

  <!-- Top Radiant Accent Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#borderGrad)" />

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="238" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />

  <!-- Status Chip (Top Left) -->
  <g transform="translate(60, 36)">
    <rect width="210" height="26" rx="13" fill="#0F172A" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <circle cx="14" cy="13" r="7" fill="#10B981" fill-opacity="0.3" />
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#22D3EE" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Location Indicator (Top Right) -->
  <g transform="translate(980, 36)">
    <rect width="160" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
    <text x="80" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">📍 Cairo, Egypt • Remote</text>
  </g>

  <!-- Main Identity Typography -->
  <text x="600" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Bavly Ashraf
  </text>

  <!-- Subtitle with Gradient Feel -->
  <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#22D3EE" letter-spacing="0.5">
    Software Engineer • Frontend Architecture &amp; Full-Stack Systems
  </text>

  <!-- Tech Spec Micro-Badges -->
  <g transform="translate(230, 182)">
    <!-- React 19 -->
    <rect x="0" y="0" width="105" height="28" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <text x="52.5" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">React 19</text>

    <!-- Next.js 14 -->
    <rect x="117" y="0" width="110" height="28" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <text x="172" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">Next.js 14</text>

    <!-- TypeScript -->
    <rect x="239" y="0" width="115" height="28" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3" />
    <text x="296.5" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">TypeScript</text>

    <!-- NestJS 10 -->
    <rect x="366" y="0" width="110" height="28" rx="8" fill="#1E293B" stroke="#E11D48" stroke-width="1" stroke-opacity="0.3" />
    <text x="421" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">NestJS 10</text>

    <!-- Microservices -->
    <rect x="488" y="0" width="125" height="28" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" />
    <text x="550.5" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">Microservices</text>

    <!-- Real-Time SSE -->
    <rect x="625" y="0" width="115" height="28" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
    <text x="682.5" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">SSE &amp; Sockets</text>
  </g>
</svg>
